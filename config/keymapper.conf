# Keyd to Keymapper translation
# Global settings
@forward-modifiers Shift Control Alt #Meta
@virtual-keys-toggle true

# Virtual keys for mode management
VirtualHotkeyMode = Virtual0
UmlautMode = Virtual1
MoneyMode = Virtual2

# ============================================================
# BASE LAYER (main)
# ============================================================

# CapsLock: tap -> enter hotkeyMode, hold -> enter hotkeyConfMode
# This is approximated with a chord timeout approach
[default]
    Meta{T} >> $(/usr/bin/x-terminal-emulator)
    # !Meta >> Virtual3
    # CapsLock >> $(notify-send "the caps fucking lock")
    CapsLock >> VirtualHotkeyMode

    CapsLock{J} >> ArrowDown
    CapsLock{H} >> ArrowLeft
    CapsLock{K} >> ArrowUp
    CapsLock{L} >> ArrowRight

    # !CapsLock >> !VirtualHotkeyMode
    # Chord: j+k = Escape
    # J{K} >> Escape

    # Chord: u+i = Underscore
    # (U I >> Shift{Minus}

# ============================================================
# ALT LAYER (when Alt is held)
# ============================================================

    # Alt+u -> oneshot umlautMode
    Alt{U} >> UmlautMode
    # Alt+e -> oneshot moneyMode
    Alt{E} >> MoneyMode

# ============================================================
# SHIFT LAYER
# ============================================================

[modifier = "Shift"]
    ShiftLeft >> CapsLock
    ShiftRight >> CapsLock

# ============================================================
# MONEY MODE (oneshot - active for one keypress after Alt+e)
# ============================================================

# Using a virtual key that auto-clears after one use
# Note: keymapper doesn't have native oneshot, so we simulate with virtual keys
# that get cleared after the next keypress

[modifier = "MoneyMode"]
    # e -> Euro (€) via RightAlt+c+=
    MoneyMode{E} >> AltRight{C} AltRight{Equal} !MoneyMode
    # c -> Cent (¢) via RightAlt+c+/
    MoneyMode{C} >> AltRight{C} AltRight{Slash} !MoneyMode
    # Any other key clears the mode
    Any >> !MoneyMode

# ============================================================
# UMLAUT MODE (oneshot - active for one keypress after Alt+u)
# ============================================================

umlauter = $(O >> )
[modifier = "UmlautMode"]
    # s -> ß (sharp S)
    S >> AltRight{S} "s" !UmlautMode
    Any >> AltRight{Any} ShiftLeft{Quote} !UmlautMode

    Any >> !UmlautMode

# ============================================================
# HOTKEY MODE (vim navigation layer)
# ============================================================

[modifier = "VirtualHotkeyMode"]
    # Exit keys
    Escape >> !VirtualHotkeyMode
    CapsLock >> !VirtualHotkeyMode

    # Vim navigation
    J >> ArrowDown
    H >> ArrowLeft
    K >> ArrowUp
    L >> ArrowRight

    # Bracket keys
    BracketLeft >> Backspace
    BracketRight >> Delete

    # Any other key (with modifiers) passes through but stays in mode
    # Only bare keys exit - this approximates keyd's behavior

# ============================================================
# CLEAR MODES ON MODIFIER RELEASE (approximation)
# ============================================================

# When Alt is released, clear oneshot modes
# !Alt >> !UmlautMode !MoneyMode

# When CapsLock is released (tap), we enter hotkeyMode
# When CapsLock is held, we enter hotkeyConfMode
# This is handled by the chord timeout on CapsLock above
